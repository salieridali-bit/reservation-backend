<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>예약 수정</title>

    <style>
        body {
            margin: 0;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .container {
            width: 520px;
            margin: 70px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        .global-error {
            background: #ffe2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button, .btn-cancel {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div>Reservation System</div>

    <div>
        <a th:href="@{/}">홈</a>
        <a th:href="@{/reservation/list}">내 예약</a>
        <a th:href="@{/reservation/create}">예약하기</a>
        <a th:href="@{/logout}">로그아웃</a>
    </div>
</div>

<div class="container">

    <h1> 예약 수정</h1>

    <form th:action="@{/reservation/edit/{id}(id=${reservationId})}"
          th:object="${reservationForm}"
          method="post">


        <div class="form-group">
            <label>회의실</label>

            <select th:field="*{roomId}">
                <option value="">회의실을 선택하세요.</option>
                <option th:each="room : ${rooms}"
                        th:value="${room.id}"
                        th:text="${room.name}">
                </option>
            </select>

            <div class="error" th:errors="*{roomId}"></div>
        </div>

        <div class="form-group">
            <label>예약 날짜</label>
            <input type="date" th:field="*{reservationDate}">
            <div class="error" th:errors="*{reservationDate}"></div>
        </div>

        <div class="form-group">
            <label>시작 시간</label>
            <input type="time" th:field="*{startTime}">
            <div class="error" th:errors="*{startTime}"></div>
        </div>

        <div class="form-group">
            <label>종료 시간</label>
            <input type="time" th:field="*{endTime}">
            <div class="error" th:errors="*{endTime}"></div>
        </div>

        <div class="buttons">
            <button type="submit">수정하기</button>
            <a th:href="@{/reservation/list}" class="btn-cancel">취소</a>
        </div>
    </form>
</div>

</body>
</html>
