<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입</title>

    <style>
      body {
        margin: 0;
        background: #f4f6f8;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card {
        width: 500px;
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #111827;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }

      .error {
        color: red;
        font-size: 13px;
        margin-top: 5px;
      }

      button {
        width: 100%;
        padding: 14px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .link {
        text-align: center;
        margin-top: 20px;
      }

      .link a {
        color: #2563eb;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>회원가입</h1>

      <form th:action="@{/signup}" th:object="${memberForm}" method="post">
        <div class="form-group">
          <label>이름</label>
          <input type="text" th:field="*{name}" />
          <div class="error" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
          <label>이메일</label>
          <input type="email" th:field="*{email}" />
          <div class="error" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" th:field="*{password}" />
          <div class="error" th:errors="*{password}"></div>
        </div>

        <div class="form-group">
          <label>비밀번호 확인</label>
          <input type="password" th:field="*{passwordConfirm}" />
          <div class="error" th:errors="*{passwordConfirm}"></div>
        </div>

        <button type="submit">회원가입</button>
      </form>

      <div class="link">
        <a th:href="@{/login}"> 로그인으로 이동 </a>
      </div>
    </div>
  </body>
</html>
