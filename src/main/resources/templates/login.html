<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>

    <style>
        body {
            margin: 0;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #111827;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>로그인</h1>

    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label>이메일</label>
            <input type="email" name="email">
        </div>

        <div class="form-gruop">
            <label>비밀번호</label>
            <input type="password" name="password">
        </div>

        <button type="submit">로그인</button>

    </form>

    <div class="link">
        <a th:href="@{/signup}">
            회원가입
        </a>
    </div>
</div>
</body>
</html>
