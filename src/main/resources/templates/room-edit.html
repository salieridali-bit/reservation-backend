<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회의실 수정</title>

    <style>
        body {
            margin: 0;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .container {
            width: 520px;
            margin: 70px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 110px;
            resize: none;
        }

        .error {
            margin-top: 5px;
            color: #dc2626;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button, .btn-cancel {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div>Reservation System</div>

    <div>
        <a th:href="@{/}">홈</a>
        <a th:href="@{/room/list}">회의실 목록</a>
        <a th:href="@{/reservation/list}">내 예약</a>
        <a th:href="@{/logout}">로그아웃</a>
    </div>
</div>

<div class="container">
    <h1>회의실 수정</h1>

    <form th:action="@{/room/edit/{id}(id=${roomId})}"
          th:object="${roomForm}"
          method="post">

        <div class="form-group">
            <label>회의실 이름</label>
            <input type="text"
                   th:field="*{name}"
                   placeholder="예: 회의실 A">
            <div class="error" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label>설명</label>
            <textarea th:field="*{description}"
                      placeholder="회의실 설명을 입력하세요"></textarea>
            <div class="error" th:errors="*{description}"></div>
        </div>

        <div class="form-group">
            <label>수용 인원</label>
            <input type="number"
                   th:field="*{capacity}"
                   placeholder="예: 10">
            <div class="error" th:errors="*{capacity}"></div>
        </div>

        <div class="buttons">
            <button type="submit">수정하기</button>
            <a th:href="@{/room/list}" class="btn-cancel">취소</a>
        </div>

    </form>
</div>

</body>
</html>
